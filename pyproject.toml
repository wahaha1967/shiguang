[project]
name = "shiguang-study"
version = "3.0.0"
description = "FastAPI backend for the Shiguang Study Room workbench"
readme = "README.md"
requires-python = ">=3.9"
# cryptography encrypts the provider API keys that the backend stores.
dependencies = [
    "cryptography>=47.0.0",
    "fastapi>=0.128.8",
    "sqlalchemy>=2.0.57",
    "uvicorn>=0.39.0",
]

[project.scripts]
shiguang-study = "shiguang_study.webapp.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Install the project into the environment so that `uv run shiguang-study`
# and `uv run python -m shiguang_study` both work.
package = true
